services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - "108"
      - "44"
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /mnt/appdata/jellyfin/config:/config
      - /mnt/appdata/jellyfin/cache:/cache
      - /mnt/core/Movies:/media/movies
      - /mnt/core/TV_Shows:/media/tv
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=[CENSORED :P]
    extra_hosts:
      - host.docker.internal:host-gateway
