services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/appdata/dockge/data:/app/data
      - /mnt/core/docker/stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
